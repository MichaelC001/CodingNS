name: desktop-build-and-release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "要构建哪些平台（手动触发时用，默认三个平台都打）"
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - android
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "22.19.0"
  PNPM_VERSION: "10.7.1"
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  probe-windows-node-entry:
    name: windows-node-entry-probe
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 准备 Node（与用户环境一致的 v24.20.0）
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: 打印 node 版本
        shell: pwsh
        run: node -v

      - name: 生成探针文件
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\probe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path "$dir\target.mjs" -Value 'console.log("ENTRY_OK")' -Encoding utf8
          @'
          import path from "node:path";
          const w = path.win32;
          const re = /^(?:[a-zA-Z]:|[\\/]{2}[^\\/]+[\\/][^\\/]+)?[\\/]*/;
          const root = (p) => (re.exec(p) || [""])[0];
          const forms = JSON.parse(process.argv[2]);
          console.log("[env] =C:  =", JSON.stringify(process.env["=C:"]));
          console.log("[env] cwd  =", JSON.stringify(process.cwd()));
          for (const [k, v] of Object.entries(forms)) {
            const r = w.resolve(v);
            console.log(`[resolve] ${k} | resolve=${JSON.stringify(r)} | splitRoot=${JSON.stringify(root(r))}`);
          }
          '@ | Set-Content -Path "$dir\probe.mjs" -Encoding utf8
          @'
          const { spawnSync } = require("node:child_process");
          const target = process.argv[2];
          const env = { ...process.env };
          delete env["=C:"];
          console.log("[spawn] 去掉 =C: 后 spawn node target ...");
          const r = spawnSync(process.execPath, [target], { env, stdio: "inherit" });
          console.log("[spawn] exit =", r.status);
          '@ | Set-Content -Path "$dir\spawn-noenv.cjs" -Encoding utf8

      - name: 逐形态测试入口路径
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\probe"
          $t = "$dir\target.mjs"
          $forms = [ordered]@{
            "normal"         = $t
            "verbatim"       = "\\?\$t"
            "verbatim_bare"  = "\\?\C:"
            "drive_relative" = "C:" + $t.Substring(2)
            "bare_drive"     = "C:"
          }
          node "$dir\probe.mjs" ($forms | ConvertTo-Json -Compress)

          foreach ($k in $forms.Keys) {
            Write-Host ""
            Write-Host "===== 运行 $k : $($forms[$k])"
            $out = & node $forms[$k] 2>&1
            $code = $LASTEXITCODE
            $out | Select-Object -First 6 | ForEach-Object { Write-Host "    $_" }
            Write-Host "    exit=$code"
          }

          Write-Host ""
          Write-Host "===== 去掉 =C: 环境变量后跑正常路径"
          node "$dir\spawn-noenv.cjs" $t

      - name: Rust canonicalize 形态（模拟 Tauri resource_dir）
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\rprobe"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Set-Content "$d\main.rs" @'
          fn main() {
              let exe = std::env::current_exe().unwrap();
              let canon = std::fs::canonicalize(&exe).unwrap();
              println!("current_exe  = {}", exe.display());
              println!("canonicalize = {}", canon.display());
              println!("resource_dir = {}", canon.parent().unwrap().display());
              println!("joined       = {}", canon.parent().unwrap().join("host-install.mjs").display());
          }
          '@
          Push-Location $d
          rustc main.rs -o probe.exe
          .\probe.exe
          Pop-Location

  build-macos-universal:
    name: macos-universal-release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'macos' }}
    runs-on: macos-26
    environment: macOS-Package
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 固定 macOS 构建 SDK
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode_26.5.app
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 导入 Apple 签名证书
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_CERTIFICATE_P12_BASE64}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${APPLE_KEYCHAIN_PASSWORD}" ]]; then
            echo "缺少 macOS 签名 secrets，请检查 APPLE_CERTIFICATE_P12_BASE64 / APPLE_CERTIFICATE_PASSWORD / APPLE_KEYCHAIN_PASSWORD" >&2
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/codingns-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codingns-signing.keychain-db"
          export CERT_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"])
          )
          PY

          security create-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${APPLE_KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          {
            echo "MACOS_KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "MACOS_KEYCHAIN_PASSWORD=${APPLE_KEYCHAIN_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: 构建并发布 macOS 安装包
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_BUILD_TARGET: universal-apple-darwin
          CODINGNS_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-desktop.sh build macos
          python3 ./scripts/verify-desktop-scrollbar-build.py \
            --dist-dir apps/user-app/dist \
            --app-archive apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/CodingNS.app.tar.gz
          ./scripts/build-desktop.sh release-macos

      - name: 验证 macOS 发布 DMG
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="apps/desktop/src-tauri/target/release/macos-release/CodingNS.dmg"
          mount_dir="$RUNNER_TEMP/codingns-release-dmg"
          expected_version="$(tr -d '[:space:]' < VERSION)"

          if [[ -z "$expected_version" ]]; then
            echo "VERSION 文件为空，无法校验 DMG 版本" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$expected_version" ]]; then
              echo "Git tag 与仓库版本不一致：tag=$tag_version version=$expected_version" >&2
              exit 1
            fi
          fi

          rm -rf "$mount_dir"
          mkdir -p "$mount_dir"

          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT

          if [[ ! -d "$mount_dir/CodingNS.app" ]]; then
            echo "DMG 中缺少 CodingNS.app" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$mount_dir/CodingNS.app"

          actual_version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$mount_dir/CodingNS.app/Contents/Info.plist"
          )"

          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "DMG 中应用版本不匹配：expected=$expected_version actual=$actual_version" >&2
            exit 1
          fi

          echo "DMG 校验通过：version=$actual_version"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/macos-release/CodingNS.dmg
            apps/desktop/src-tauri/target/release/macos-release/CodingNS.app
            apps/desktop/src-tauri/target/release/macos-release/CodingNS.zip
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig

  build-windows:
    name: windows-installers
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'windows' }}
    runs-on: windows-latest
    environment: macOS-Package
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        env:
          CODINGNS_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: ./scripts/build-desktop.sh windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig

      - name: 校验 Windows 产物符合版本通道
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          bundle_root="apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          msi_dir="${bundle_root}/msi"
          nsis_dir="${bundle_root}/nsis"
          msi_count="0"
          exe_count="0"

          if [[ -d "${msi_dir}" ]]; then
            msi_count="$(find "${msi_dir}" -maxdepth 1 -type f -name '*.msi' | wc -l | tr -d '[:space:]')"
          fi

          if [[ -d "${nsis_dir}" ]]; then
            exe_count="$(find "${nsis_dir}" -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d '[:space:]')"
          fi

          if [[ "${exe_count}" -eq 0 ]]; then
            echo "Windows 构建没有产出 NSIS 安装包" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            if [[ "${msi_count}" -ne 0 ]]; then
              echo "预发布版本 ${version} 不应产出 MSI" >&2
              exit 1
            fi
            echo "预发布版本 ${version} 校验通过：仅产出 NSIS。"
          else
            if [[ "${msi_count}" -eq 0 ]]; then
              echo "稳定版 ${version} 必须产出 MSI" >&2
              exit 1
            fi
            echo "稳定版 ${version} 校验通过：同时产出 MSI 和 NSIS。"
          fi

  build-android:
    name: android-apk
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets == 'all' || inputs.targets == 'android' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 默认会安装已经废弃的 tools 包，改为只安装当前仍存在的基础组件。
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

          selected_ndk=""
          for ndk_version in "${ANDROID_NDK_VERSION}" "27.0.12077973" "26.3.11579264"; do
            if sdkmanager "ndk;${ndk_version}"; then
              selected_ndk="${ndk_version}"
              break
            fi
          done

          if [[ -z "${selected_ndk}" ]]; then
            echo "未能安装可用的 Android NDK" >&2
            exit 1
          fi

          {
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT}"
            echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${selected_ndk}"
          } >> "$GITHUB_ENV"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/user-app/src-tauri -> target"

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Android release APK
        shell: bash
        run: bash ./scripts/build-android.sh release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: |
            apps/user-app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos-universal
      - build-windows
      - build-android
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"

          if ! gh release view "${tag_name}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${tag_name}" \
              --repo "${GH_REPO}" \
              --title "${tag_name}" \
              --notes "Automated desktop release assets."
          fi

      - name: 生成桌面 updater latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GH_REPO"]
          tag_name = os.environ["GITHUB_REF_NAME"]
          release_assets = Path("release-assets")

          mac_updates = sorted(release_assets.rglob("*.app.tar.gz"))
          mac_sigs = sorted(release_assets.rglob("*.app.tar.gz.sig"))
          win_updates = [
              path for path in sorted(release_assets.rglob("*.exe"))
              if not path.name.endswith(".sig")
          ]
          win_sigs = sorted(release_assets.rglob("*.exe.sig"))

          if not mac_updates or not mac_sigs or not win_updates or not win_sigs:
              raise SystemExit("缺少桌面 updater 产物，无法生成 latest.json")

          release_info = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "release",
                      "view",
                      tag_name,
                      "--repo",
                      repo,
                      "--json",
                      "body,publishedAt",
                  ],
                  text=True,
              )
          )

          version = tag_name[1:] if tag_name.startswith("v") else tag_name

          def asset_url(path: Path) -> str:
              return f"https://github.com/{repo}/releases/download/{tag_name}/{path.name}"

          manifest = {
              "version": version,
              "notes": release_info.get("body") or "",
              "pub_date": release_info.get("publishedAt"),
              "platforms": {
                  "macos-universal": {
                      "signature": mac_sigs[0].read_text(encoding="utf-8").strip(),
                      "url": asset_url(mac_updates[0]),
                  },
                  "windows-x86_64": {
                      "signature": win_sigs[0].read_text(encoding="utf-8").strip(),
                      "url": asset_url(win_updates[0]),
                  },
              },
          }

          (release_assets / "latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: 生成 Android android-apk.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          apk_path="$(find release-assets -type f -name 'app-universal-release.apk' | head -n 1)"

          if [[ -z "${apk_path}" ]]; then
            echo "缺少 Android APK 产物，无法生成 android-apk.json" >&2
            exit 1
          fi

          gh release view "${GITHUB_REF_NAME}" \
            --repo "${GH_REPO}" \
            --json body \
            --jq '.body' > release-assets/android-release-notes.txt

          published_at="$(gh release view "${GITHUB_REF_NAME}" --repo "${GH_REPO}" --json publishedAt --jq '.publishedAt')"
          html_url="$(gh release view "${GITHUB_REF_NAME}" --repo "${GH_REPO}" --json url --jq '.url')"

          node ./scripts/generate-android-release-manifest.mjs \
            --apk "${apk_path}" \
            --output release-assets/android-apk.json \
            --channel stable \
            --download-url "https://github.com/${GH_REPO}/releases/latest/download/app-universal-release.apk" \
            --published-at "${published_at}" \
            --html-url "${html_url}" \
            --notes-file release-assets/android-release-notes.txt

      - name: 上传 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"

          mapfile -d "" files < <(
            find release-assets -type f \
              \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.sig" -o -name "*.tar.gz" -o -name "*.apk" -o -name "latest.json" -o -name "android-apk.json" \) \
              -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were found." >&2
            exit 1
          fi

          gh release upload "${tag_name}" "${files[@]}" --repo "${GH_REPO}" --clobber
